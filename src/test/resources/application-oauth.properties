quarkus.datasource.db-kind=h2
quarkus.datasource.jdbc.url=jdbc:h2:mem:test;MODE=MySQL
quarkus.mailer.mock=true
oidc.jwt.expiration.access-token=PT5M
oidc.jwt.expiration.mfa-token=PT5M
app.security.encryption.key=test-encryption-key
security.digest.peppers=t0:test-digest-pepper
security.digest.current=t0
security.secrets.keys=t0:test-secret-key
security.secrets.current=t0
oidc.base-url=http://localhost:8081

# Exclude feature areas not covered by oidc-flow tests.
# These modules currently expose use cases whose gateways are intentionally pending
# concrete persistence adapters.
# ResolveParRequestUsecase is covered by ScenarioResolveParRequestUsecase (@Alternative).
quarkus.arc.exclude-types=\
  {{base}}.feature.oauth.webauthn.**,\
  {{base}}.feature.oauth.userinvitation.**,\
  {{base}}.feature.oauth.profile.**,\
  {{base}}.feature.oauth.device.**,\
  {{base}}.feature.oauth.par.**,\
  {{base}}.feature.oauth.session.infrastructure.driver.rest.**,\
  {{base}}.feature.oauth.authentication.application.granter.DeviceCodeGranter,\
  {{base}}.feature.oauth.authentication.infrastructure.driver.rest.InformationController,\
  {{base}}.feature.oauth.authentication.infrastructure.driver.rest.DevicesAccessController,\
  {{base}}.feature.oauth.client.application.usecase.registerclient.**,\
  {{base}}.feature.oauth.client.application.usecase.readdynamicclient.**,\
  {{base}}.feature.oauth.client.application.usecase.updatedynamicclient.**,\
  {{base}}.feature.oauth.client.application.usecase.deletedynamicclient.**

# Pairwise subjects (task 4.4) need a salt; production sets OIDC_PAIRWISE_SALT.
oidc.pairwise.salt=test-pairwise-salt
