quarkus.datasource.db-kind=h2
quarkus.datasource.jdbc.url=jdbc:h2:mem:test;MODE=MySQL
quarkus.mailer.mock=true
oidc.jwt.expiration.access-token=PT5M
oidc.jwt.expiration.mfa-token=PT5M
app.security.encryption.key=test-encryption-key
security.digest.peppers=t0:test-digest-pepper
security.digest.current=t0
security.secrets.keys=t0:test-secret-key
security.secrets.current=t0
oidc.base-url=http://localhost:8081

# Pairwise subjects (task 4.4) need a salt; production sets OIDC_PAIRWISE_SALT.
oidc.pairwise.salt=test-pairwise-salt

# All flow tests share one app instance and one rate-limit bucket (keyed by request host), so the
# production limits would answer 429 once the suite passes a few hundred requests.
app.rate-limit.bucket-capacity=1000000
app.rate-limit.refill-tokens=1000000
