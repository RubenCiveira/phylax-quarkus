quarkus.datasource.db-kind=h2
quarkus.datasource.jdbc.url=jdbc:h2:mem:test
quarkus.mailer.mock=true
oauth.jwt.expiration.access-token=PT5M
oauth.jwt.expiration.mfa-token=PT5M
app.security.encryption.key=test-encryption-key
oauth.base-url=http://localhost:8081

# Exclude feature areas not covered by oidc-flow tests.
# These modules currently expose use cases whose gateways are intentionally pending
# concrete persistence adapters.
quarkus.arc.exclude-types=net.civeira.phylax.features.oauth.webauthn.**,net.civeira.phylax.features.oauth.userinvitation.**,net.civeira.phylax.features.oauth.profile.**,net.civeira.phylax.features.oauth.device.**,net.civeira.phylax.features.oauth.par.**,net.civeira.phylax.features.oauth.client.application.usecase.registerclient.**,net.civeira.phylax.features.oauth.client.application.usecase.readdynamicclient.**,net.civeira.phylax.features.oauth.client.application.usecase.updatedynamicclient.**,net.civeira.phylax.features.oauth.client.application.usecase.deletedynamicclient.**
