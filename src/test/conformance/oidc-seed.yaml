# Seed de InstallAccess para la conformidad (V.2): tenant raíz "main" y usuario ROOT sin
# contraseña temporal, para que la suite pueda iniciar sesión sin pasos extra.
oidc:
  tenant:
    name: main
    domain: main
  root:
    name: ROOT
    password: ${OIDC_ROOT_PASSWORD:}
    temporal-password: false
  relying-party:
    code: conformance-api
    api-key: ${OIDC_RELYING_PARTY_API_KEY:}
  trusted-client:
    code: conformance-ui
    redirect: https://localhost.emobix.co.uk:8443/test/a/phylax/callback
    logout-redirect: https://localhost.emobix.co.uk:8443/test/a/phylax/post_logout_redirect
  api-keys:
    collector: ${OIDC_API_KEYS_COLLECTOR:}
    sync: ${OIDC_API_KEYS_SYNC:}
