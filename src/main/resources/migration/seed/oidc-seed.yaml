# Valores iniciales del seed InstallAccess (solo se usan una vez, con la base de datos vacía).
#
# Los secretos no tienen valor por defecto: se dan con variables de entorno (OIDC_ROOT_PASSWORD,
# OIDC_RELYING_PARTY_API_KEY...) o con un fichero config/migration/seed/oidc-seed.yaml en el
# despliegue. Si faltan, el seed genera valores aleatorios y los muestra una sola vez en el log.
oidc:
  tenant:
    name: main
    domain: main
  root:
    name: ROOT
    password: ${OIDC_ROOT_PASSWORD:}
    # Obliga a cambiar la contraseña en el primer login.
    temporal-password: true
  relying-party:
    code: civi-acme-api
    api-key: ${OIDC_RELYING_PARTY_API_KEY:}
  trusted-client:
    code: civi-acme-ui
    secret: ${OIDC_TRUSTED_CLIENT_SECRET:}
    redirect: http://localhost:4200/*
  api-keys:
    collector: ${OIDC_API_KEYS_COLLECTOR:}
    sync: ${OIDC_API_KEYS_SYNC:}

