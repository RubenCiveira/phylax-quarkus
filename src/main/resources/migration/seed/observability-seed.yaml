# @autogenerated
# Initial values of the seed InstallObservability (used once, completing what is missing).
#
# The secrets have no default value: they are given with environment variables or with a file
# config/migration/seed/observability-seed.yaml in the deployment. If they are missing, the seed
# generates random values and shows them once in the log.
observability:
  viewer-client:
    code: observe-viewer
    redirect: ${OBSERVE_PUBLIC_URL:http://localhost:8090}/observe/callback
    logout-redirect: ${OBSERVE_PUBLIC_URL:http://localhost:8090}/observe/
    # Empty: the relying party of oidc-seed.yaml (oidc.relying-party.code)
    audience: ${OBSERVE_VIEWER_AUDIENCE:}
  test-user:
    # Test user with read access to the viewer; disable it in production
    enabled: ${OBSERVE_TEST_USER_ENABLED:true}
    # Empty: the tenant of oidc-seed.yaml (oidc.tenant.name)
    tenant: ${OBSERVE_TEST_USER_TENANT:}
    name: observer
    password: ${OBSERVE_TEST_USER_PASSWORD:}
    temporal-password: true
  ingest-keys:
    # Ingest keys of the front (trusted client) and the api (relying party) of oidc-seed.yaml;
    # empty keeps the random ones of the synchronization
    ui: ${OBSERVE_INGEST_UI:}
    api: ${OBSERVE_INGEST_API:}

