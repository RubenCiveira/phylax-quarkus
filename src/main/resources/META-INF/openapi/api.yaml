    ObservedSourceApiDto:
      type: object
      description: Origin allowed to send telemetry (logs and traces) the application itself, a client application or an api. It is the only table the ingestion checks. The rows of the referenced entities (oauth clients, resource servers) are created and updated by the synchronization of the trait; the others are created by hand. It is not tenant data only the managers of the platform see it.
      properties:
        uid:
          description: Unique identifier of the origin.
          type: string
        originType:
          description: Where the origin comes from app (a client application), api (a resource server), self (this application) or own (created by hand).
          type: string
        originRef:
          description: Identifier of the row of the referenced entity (oauth client or resource server). Not a foreign key, so the referenced row can be deleted the origin is then marked as detached.
          type: string
        managed:
          description: The origin is kept in sync from a referenced entity its code, name and origin-enabled are overwritten by the synchronization.
          type: boolean
        code:
          description: Code of the origin, sent with every event as its source (service name).
          type: string
        name:
          description: Name shown in the viewer.
          type: string
        kind:
          description: What the origin is it chooses its predefined dashboard and the suggested SDK.
          type: string
          enum: [backend,frontend,worker,mobile]
        originEnabled:
          description: Copy of the enabled flag of the referenced entity a disabled client or api cannot send telemetry.
          type: boolean
        detached:
          description: The referenced row was deleted. The origin and its data are kept, but it cannot send telemetry.
          type: boolean
        environment:
          description: Deployment environment of the origin (dev, pre, pro...), shown in the viewer.
          type: string
        ingestKey:
          description: Key the origin sends in the X-Observe-Key header. Generated at random when the origin is created; only the administrators of the observability see it.
          type: string
        allowedOrigins:
          description: Comma-separated web origins (scheme://host:port) a browser can send from with this key. Empty to accept only server to server calls.
          type: string
        minLevel:
          description: Minimum level of the logs that are stored TRACE, DEBUG, INFO, WARN, ERROR or FATAL.
          type: string
        traceSampleRate:
          description: Percentage (0-100) of the traces that are stored; the traces with errors are always stored.
          type: integer
          format: int32
        errorSampleRate:
          description: Percentage (0-100) of the error events that are stored.
          type: integer
          format: int32
        rateLimit:
          description: Events per minute accepted from the origin; the excess is discarded and counted in dropped-count.
          type: integer
          format: int32
        metricsMode:
          description: How the metrics of the origin arrive push (OTLP or the SDK), scrape (the collector reads scrape-url) or disabled.
          type: string
          enum: [push,scrape,disabled]
        scrapeUrl:
          description: Prometheus endpoint the collector reads when metrics-mode is scrape (e.g. http://billing:8080/q/metrics).
          type: string
        scrapeInterval:
          description: Seconds between two reads of scrape-url.
          type: integer
          format: int32
        maxSeries:
          description: Maximum number of metric series of the origin; the new ones above it are added to an __overflow__ series.
          type: integer
          format: int32
        deriveMetrics:
          description: Computes RED metrics from the spans and counts from the logs and errors of the origin.
          type: boolean
        retentionDays:
          description: Days the data of the origin are kept. Empty to use the global retention of the configuration.
          type: integer
          format: int32
        scrubFields:
          description: Comma-separated extra keys masked in the events of the origin, besides the global ones of the configuration.
          type: string
        lastSeenAt:
          description: When the last event of the origin arrived (updated at most once a minute).
          type: string
          format: date-time
        droppedCount:
          description: Events of the origin discarded by the rate limit or because the queue was full (saved every minute by the collector).
          type: integer
          format: int32
        expectedEveryMinutes:
          description: The origin is expected to send something at least every these minutes; the source-silent alert rules use it instead of their window. Empty the window of the rule.
          type: integer
          format: int32
        enabled:
          description: A disabled origin is rejected by the ingestion, without deleting it or its data.
          type: boolean
        version:
          description: Campo con el número de version de observed source para controlar bloqueos optimistas
          type: integer
          format: int32
    ObservedSourceApiDtoList:
      type: object
      properties:
        self:
          type: string
        first:
          type: string
        next:
          type: string
        items:
          type: array
          items:
