    TenantLoginProviderApiDto:
      type: object
      description: Represents a login identity provider (e.g., Google, GitHub, SAML) configured for a tenant. Enables federated authentication integration.
      properties:
        uid:
          description: Unique identifier of the login provider.
          type: string
        tenant:
          $ref: '#/components/schemas/TenantApiRef'
        name:
          description: A name that identifies this login provider within the tenant.
          type: string
        providerType:
          description: The source protocol or system used for authentication (e.g., GOOGLE, GITHUB, SAML).
          type: string
          enum: [google,github,microsoft,apple,saml,oidc]
        enabled:
          description: Only enabled providers are offered on the sign-in screen.
          type: boolean
        directAccess:
          description: If true, the system will default to this login method without requiring selection.
          type: boolean
        publicKey:
          description: Client identifier registered with the identity provider (the OIDC client_id).
          type: string
        privateKey:
          description: Secret registered with the identity provider (the OIDC client_secret), used to exchange the codes it returns.
          type: string
        certificate:
          description: The provider certificate used for signature verification, if required.
          type: string
        metadata:
          description: A metadata file required by some providers for configuration (e.g., SAML descriptor).
          type: string
        oidcScopes:
          description: Scopes requested from the OIDC identity provider.
          type: string
        oidcClaimMapping:
          description: JSON map from the claims of the identity provider to the user attributes.
          type: string
        accountLinkPolicy:
          description: How a federated sign-in is linked to an existing user never, when the email matches and is verified, or only manually.
          type: string
          enum: [none,verified-email,manual]
        oidcDiscoveryUrl:
          description: For source=OIDC the /.well-known/openid-configuration URL of the external OIDC identity provider. The system will fetch authorization_endpoint, token_endpoint, and jwks_uri from this document at startup. public-key holds the OIDC client_id; private-key holds the OIDC client_secret.
          type: string
        samlIdpMetadataUrl:
          description: URL of the SAML metadata of the identity provider.
          type: string
        samlIdpEntityId:
          description: Entity ID of the SAML identity provider.
          type: string
        samlIdpSsoUrl:
          description: Single sign-on URL of the SAML identity provider.
          type: string
        samlIdpCert:
          description: Certificate of the SAML identity provider, used to verify its signed assertions.
          type: string
        usersEnabledByDefault:
          description: Defines whether the users created with this provider are enabled by default.
          type: boolean
        version:
          description: Campo con el número de version de tenant login provider para controlar bloqueos optimistas
          type: integer
          format: int32
