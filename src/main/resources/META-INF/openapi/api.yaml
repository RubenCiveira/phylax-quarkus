    TenantConfigApiDto:
      type: object
      description: Settings of a tenant sign-up, sign-in, MFA, token lifetimes, dynamic client registration and notification emails.
      properties:
        uid:
          description: Unique identifier of the configuration.
          type: string
        tenant:
          $ref: '#/components/schemas/TenantApiRef'
        displayName:
          description: Name shown to the users of the tenant, for example on the sign-in screen.
          type: string
        forceMfa:
          description: Requires every user of the tenant to sign in with a second factor.
          type: boolean
        dynamicRegistrationPolicy:
          description: Who can register clients dynamically anyone (open), only with an initial access token (token_required) or nobody (disabled).
          type: string
          enum: [open,token-required,disabled]
        selfRegistrationEnabled:
          description: Lets users create their own account from the sign-in screen.
          type: boolean
        autoApproveRegisteredUsers:
          description: Self-registered users can sign in right away; otherwise they wait for an administrator to approve them.
          type: boolean
        magicLinkEnabled:
          description: Lets users sign in with a link sent by email, without password.
          type: boolean
        requireEmailVerification:
          description: If true, users must confirm their email address via the verification link before they can complete their first login. The OIDC flow will hold the user at a verification-pending challenge until the link is clicked.
          type: boolean
        invitationExpiryDays:
          description: Number of days before an unused user invitation expires.
          type: integer
          format: int32
        magicLinkExpiryMinutes:
          description: Number of minutes before a magic-link token expires after being sent. Only relevant when magic-link-enabled=true.
          type: integer
          format: int32
        sessionSsoTtlSeconds:
          description: Lifetime in seconds of the cross-client SSO session cookie. After this duration the user must re-authenticate even if a per-flow session is still valid. Corresponds to the max_age upper bound for prompt=none requests.
          type: integer
          format: int32
        refreshTokenTtlSeconds:
          description: Lifetime in seconds of issued refresh tokens. Defaults to 30 days (2 592 000 s). Applies to all grant types that issue refresh tokens for this tenant.
          type: integer
          format: int32
        refreshTokenMaxLifetimeSeconds:
          description: Absolute lifetime of a refresh token family; rotation never extends it.
          type: integer
          format: int32
        dcrAllowedGrantTypes:
          description: JSON list of the grant types a dynamically registered client may request.
          type: string
        dcrAllowedAuthMethods:
          description: JSON list of the token endpoint authentication methods a dynamically registered client may use.
          type: string
        allowPasswordGrant:
          description: Allows the resource owner password grant, in which the client receives the user credentials directly.
          type: boolean
        requirePushedAuthorizationRequests:
          description: Requires every client of the tenant to send its authorization requests through PAR (RFC 9126).
          type: boolean
        acrValuesSupported:
          description: JSON map of published ACR values to session level, e.g. {"urn:lugh:acr:pwd":1,"urn:lugh:acr:mfa":2}
          type: string
        webauthnEnabled:
          description: Lets users sign in with passkeys and security keys (WebAuthn).
          type: boolean
        webauthnRpId:
          description: WebAuthn relying party identifier the domain the passkeys are bound to.
          type: string
        webauthnRpName:
          description: Name of the relying party shown by the browser when creating a passkey.
          type: string
        welcomeEmailTemplate:
          description: Email sent to a user when the account is enabled for the first time.
          type: string
        registeredEmailTemplate:
          description: Email sent when a user registers.
          type: string
        disabledUserEmailTemplate:
          description: Email sent when a user is disabled.
          type: string
        enabledUserEmailTemplate:
          description: Email sent when a user is enabled.
          type: string
        passwordRecoveryEnabled:
          description: Lets users reset a forgotten password by email.
          type: boolean
        recoverPassEmailTemplate:
          description: Email sent to the user to recover the password.
          type: string
        version:
          description: Campo con el número de version de tenant config para controlar bloqueos optimistas
          type: integer
          format: int32
