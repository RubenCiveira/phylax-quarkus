    ObservedAlertRuleApiDto:
      type: object
      description: Rule that turns what the collector sees into a notification a new issue, a regression, an error rate above a threshold, a source that stops sending or a collector that drops events. Each rule has its channel (log, webhook or email) and avoids repeated notices with its cooldown.
      properties:
        uid:
          description: Unique identifier of the rule.
          type: string
        name:
          description: Name shown in the notices.
          type: string
        trigger:
          description: What fires the rule new-issue, regression, error-rate (errors per minute above threshold during window-minutes), source-silent (no event during window-minutes), collector-dropping (the queue discards events), slo-burn (an objective spends its error budget too fast), probe-down (a probe fails its checks), tls-expiring (the certificate of a probe expires soon) or anomaly (traffic, errors or latency of an origin out of what is usual for that hour).
          type: string
          enum: [new-issue,regression,error-rate,source-silent,collector-dropping,slo-burn,probe-down,tls-expiring,anomaly]
        origin:
          $ref: '#/components/schemas/ObservedSourceApiRef'
        minLevel:
          description: For new-issue and regression minimum level of the issue.
          type: string
          enum: [error,fatal]
        threshold:
          description: For error-rate errors per minute (average of the window) that fire the rule.
          type: integer
          format: int32
        windowMinutes:
          description: For error-rate and source-silent minutes of the evaluation window.
          type: integer
          format: int32
        channel:
          description: Where the notice goes log (a warning in the log of the application), webhook (POST JSON, compatible with Slack and Teams) or email (needs multitenant-notification).
          type: string
          enum: [log,webhook,email]
        target:
          description: Comma-separated emails, or the URL of the webhook.
          type: string
        cooldownMinutes:
          description: Minimum minutes between two notices of the same rule and problem.
          type: integer
          format: int32
        mutedUntil:
          description: The rule does not notify until this moment (maintenance windows); the alerts are still recorded.
          type: string
          format: date-time
        enabled:
          description: A disabled rule is not evaluated.
          type: boolean
        version:
          description: Campo con el número de version de observed alert rule para controlar bloqueos optimistas
          type: integer
          format: int32
