      description: Outbox entry for an outgoing notification (currently an email) the rendered content waits here until the dispatcher sends it, retrying on failure.
      properties:
        uid:
          description: Unique identifier of the message.
          type: string
        target:
          description: Recipient address of the notification (the destination email).
          type: string
