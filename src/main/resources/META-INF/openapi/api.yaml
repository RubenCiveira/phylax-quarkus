          type: string
        port:
          description: Port of the SMTP server (usually 587 with STARTTLS or 465 with implicit TLS).
          type: integer
          format: int32
        login:
          description: User name to authenticate against the SMTP server.
          type: string
        password:
          description: Password to authenticate against the SMTP server; stored encrypted.
          type: string
        senderName:
          description: Display name shown as the sender of the emails.
          type: string
        senderEmail:
