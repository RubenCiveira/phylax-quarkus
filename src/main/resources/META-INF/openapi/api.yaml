    ObservedIssueApiDto:
      type: object
      description: Group of identical error events reported by an observed source. Events are grouped automatically by their fingerprint (exception type and first in-app stack frames), so operators triage one issue with its count and first/last occurrence instead of every single event. It is not an alert it is never configured and never notifies. Resolving an issue closes it until the same fingerprint is seen again, which reopens it as a regression.
      properties:
        uid:
          description: Unique identifier of the issue.
          type: string
        origin:
          $ref: '#/components/schemas/ObservedSourceApiRef'
        fingerprint:
          description: Hash of the exception type and the first in-app frames without line numbers (or of the normalized message); unique per source.
          type: string
        title:
          description: Exception type and normalized message.
          type: string
        culprit:
          description: Function or file of the first in-app frame.
          type: string
        kind:
          description: ERROR errors grouped by fingerprint. PERFORMANCE performance problems detected in the traces (N+1 queries, slow operations).
          type: string
          enum: [error,performance]
        level:
          description: Level of the grouped events.
          type: string
          enum: [warning,error,fatal]
        status:
          description: Triage state UNRESOLVED, RESOLVED (closed until it is seen again, then it reopens as a regression), IGNORED or MERGED (its events count in merged-into).
          type: string
          enum: [unresolved,resolved,ignored,merged]
        mergedInto:
          description: Uid of the issue this one was merged into; its fingerprint is an alias of that issue.
          type: string
        assignee:
          description: Who takes care of the issue (the user of the viewer that assigned it).
          type: string
        assigneeName:
          description: Name of the assignee, as the viewer shows it.
          type: string
        ignoreUntil:
          description: An IGNORED issue reopens after this moment (empty ignored for ever, or by count).
          type: string
          format: date-time
        ignoreUntilCount:
          description: An IGNORED issue reopens when its count reaches this value (empty ignored for ever, or by date).
          type: integer
          format: int32
        trackerUrl:
          description: Task of the issue in the issue tracker (Redmine, Jira...).
          type: string
        firstSeenAt:
          description: When the first event of the issue arrived.
          type: string
          format: date-time
        lastSeenAt:
          description: When the last event of the issue arrived.
          type: string
          format: date-time
        count:
          description: Number of events grouped in the issue.
          type: integer
          format: int32
        lastEventId:
          description: Identifier of the last raw event in the store, to open it.
          type: string
        lastTraceId:
          description: Trace of the last event, to open it in the viewer.
          type: string
        users:
          description: Approximate number of distinct users (or browser sessions, when the event has no user) that suffered the issue.
          type: integer
          format: int32
        tenants:
          description: Approximate number of distinct tenants where the issue was seen.
          type: integer
          format: int32
        usersSketch:
          description: HyperLogLog sketch of the pseudonymized users, to keep counting without storing them (base64; not reversible).
          type: string
        tenantsSketch:
          description: HyperLogLog sketch of the pseudonymized tenants (base64; not reversible).
          type: string
        firstRelease:
          description: Version of the origin where the issue was seen for the first time.
          type: string
        release:
          description: Last version of the origin where the issue was seen. A RESOLVED issue reopens only when it is seen again in a later version (resolved in the next release).
          type: string
        version:
          description: Campo con el número de version de observed issue para controlar bloqueos optimistas
          type: integer
          format: int32
    ObservedIssueApiDtoList:
      type: object
      properties:
        self:
          type: string
