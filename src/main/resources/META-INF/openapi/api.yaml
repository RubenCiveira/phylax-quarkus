    UserApiDto:
      type: object
      description: Person who signs in to a tenant, with a password, a federated identity provider, passkeys or a second factor.
      properties:
        uid:
          description: Unique identifier of the user.
          type: string
        tenant:
          $ref: '#/components/schemas/TenantApiRef'
        name:
          description: User name entered on the sign-in screen.
          type: string
        password:
          description: Password of the user when the sign-in is not delegated to an identity provider; only its hash is stored.
          type: string
        email:
          description: Email used to send notifications to the user.
          type: string
        welcomeAt:
          description: When the welcome email was sent.
          type: string
          format: date-time
        emailVerified:
          description: Indicates whether the user has confirmed ownership of their email address by clicking the verification link sent at registration. Used by the OIDC flow to emit the email_verified claim and optionally block login until confirmed.
          type: boolean
        enabled:
          description: A disabled user cannot sign in; on each attempt the user is told that the account is disabled.
          type: boolean
        approvalStatus:
          description: Approval state of the account email not verified yet, pending approval by an administrator, accepted or rejected.
          type: string
          enum: [unverified,pending,accepted,rejected]
        temporalPassword:
          description: The password is temporary the user must set a new one at the next sign-in.
          type: boolean
        useSecondFactors:
          description: The user signs in with a one-time password (TOTP) as second factor.
          type: boolean
        secondFactorSeed:
          description: Secret seed of the one-time password generator; stored encrypted.
          type: string
        blockedUntil:
          description: A blocked user cannot sign in until this date; on each attempt the user gets a generic not-allowed message.
          type: string
          format: date-time
        federatedProvider:
          description: Identity provider the user signed up with, kept even if the provider changes later.
          type: string
        version:
          description: Campo con el número de version de user para controlar bloqueos optimistas
          type: integer
          format: int32
