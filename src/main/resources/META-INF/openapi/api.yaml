          type: boolean
        maxRetries:
          description: Delivery attempts before a message is abandoned.
          type: integer
          format: int32
        retryDelay:
          description: Seconds to wait before retrying a failed delivery.
          type: integer
          format: int32
        rateLimit:
          description: Maximum number of emails sent per dispatch cycle with this configuration.
          type: integer
          format: int32
        version:
