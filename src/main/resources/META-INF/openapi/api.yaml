    ObservedSloApiDto:
      type: object
      description: Service level objective of an origin, measured on its RED metrics availability (requests without error) or latency (requests faster than latency-ms), with a target in thousandths (995 = 99.5 %) over a window of days. The viewer shows its compliance and remaining error budget, and the slo-burn alert rules notify when the budget is spent too fast.
      properties:
        uid:
          description: Unique identifier of the objective.
          type: string
        name:
          description: Name of the objective (Orders API available, Checkout fast...).
          type: string
        origin:
          $ref: '#/components/schemas/ObservedSourceApiRef'
        route:
          description: Only this route (http.route); empty for every route of the origin.
          type: string
        kind:
          description: availability good requests are the ones without error. latency good requests are the ones faster than latency-ms.
          type: string
          enum: [availability,latency]
        objective:
          description: Target of good requests, in thousandths 995 is 99.5 %, 999 is 99.9 %.
          type: integer
          format: int32
        latencyMs:
          description: For latency limit of a good request, in milliseconds. It is rounded down to a bucket of the latency histogram (5, 10, 25, 50, 100, 250, 500, 1000, 2500, 5000, 10000).
          type: integer
          format: int32
        windowDays:
          description: Days of the window of the objective (28 or 30 usually).
          type: integer
          format: int32
        enabled:
          description: A disabled objective is not evaluated.
          type: boolean
        version:
          description: Campo con el número de version de observed slo para controlar bloqueos optimistas
          type: integer
          format: int32
