# @autogenerated
openapi: 3.0.1
info:
  title: OpenAPI definition
  version: 0.1.1
  contact:
    name: Ruben
  license:
    name: apache
servers:
- url: https://{host}:{port}/{basePath}
  description: The production API server
  variables:
    host:
      default: localhost
      description: this value is assigned by the service provider, in this example `gigantic-server.com`
    port:
      enum:
        - '8090'
      default: '8090'
    basePath:
      default: ''
security:
  - BearerAuth: [] # Aplica el esquema de seguridad por defecto a toda la API
tags:
  - name: template
    description: Document the system renders for a channel (an email, an SMS or an HTML page), identified by its code. A tenant-specific template overrides the global one with the same code; the content lives in its versions, one per locale.
  - name: template-batch
    description: Massive operations for template
  - name: template-audit
    description: Audit operations for changes on template
  - name: template-acl
    description: Access control for template
  - name: snippet
    description: Reusable fragment (legal footer, privacy notice, company address) that templates include by code. A tenant-specific snippet overrides the global one with the same code.
  - name: snippet-batch
    description: Massive operations for snippet
  - name: snippet-audit
    description: Audit operations for changes on snippet
  - name: snippet-acl
    description: Access control for snippet
  - name: role
    description: Role that can be assigned to users, optionally limited to a resource server.
  - name: role-batch
    description: Massive operations for role
  - name: role-audit
    description: Audit operations for changes on role
  - name: role-acl
    description: Access control for role
  - name: user-group-membership
    description: Groups a user belongs to, globally or for a specific resource server or client; published in the tokens.
  - name: user-group-membership-batch
    description: Massive operations for user group membership
  - name: user-group-membership-audit
    description: Audit operations for changes on user group membership
  - name: user-group-membership-acl
    description: Access control for user group membership
  - name: oauth-client
    description: Application that signs users in or requests tokens through OAuth 2.0 / OpenID Connect. The client is sent in every authorization request, so the tenant is resolved from it.
  - name: oauth-client-batch
    description: Massive operations for oauth client
  - name: oauth-client-audit
    description: Audit operations for changes on oauth client
  - name: oauth-client-acl
    description: Access control for oauth client
  - name: theme-version
    description: Layout of a theme for a channel and a locale, chosen by BCP 47 negotiation like template versions.
  - name: theme-version-batch
    description: Massive operations for theme version
  - name: theme-version-audit
    description: Audit operations for changes on theme version
  - name: theme-version-acl
    description: Access control for theme version
  - name: snippet-version
    description: Content of a snippet for a locale, chosen by BCP 47 negotiation like template versions.
  - name: snippet-version-batch
    description: Massive operations for snippet version
  - name: snippet-version-audit
    description: Audit operations for changes on snippet version
  - name: snippet-version-acl
    description: Access control for snippet version
  - name: template-version
    description: Content of a template for a locale. When rendering, the version is chosen by BCP 47 negotiation exact locale, then language, then the default version.
  - name: template-version-batch
    description: Massive operations for template version
  - name: template-version-audit
    description: Audit operations for changes on template version
  - name: template-version-acl
    description: Access control for template version
  - name: snippet-asset
    description: File (image, stylesheet, font) used by a snippet.
  - name: snippet-asset-batch
    description: Massive operations for snippet asset
  - name: snippet-asset-audit
    description: Audit operations for changes on snippet asset
  - name: snippet-asset-acl
    description: Access control for snippet asset
  - name: api-key-client
    description: Application that accesses the APIs with an API key instead of OAuth tokens.
  - name: api-key-client-batch
    description: Massive operations for api key client
  - name: api-key-client-audit
    description: Audit operations for changes on api key client
  - name: api-key-client-acl
    description: Access control for api key client
  - name: user-personal-api-key
    description: A personal API key (PAT) scoped to a specific user. The raw key is shown to the user only at creation time and is never stored. Subsequent authentication searches by its digest (HMAC with pepper) and compares it in constant time.
  - name: user-personal-api-key-batch
    description: Massive operations for user personal api key
  - name: user-personal-api-key-audit
    description: Audit operations for changes on user personal api key
  - name: user-personal-api-key-acl
    description: Access control for user personal api key
  - name: template-variable
    description: Default value of a variable available to the templates of a tenant; the caller can override it when rendering.
  - name: template-variable-batch
    description: Massive operations for template variable
  - name: template-variable-audit
    description: Audit operations for changes on template variable
  - name: template-variable-acl
    description: Access control for template variable
  - name: theme
    description: Layout shared by several templates (header, footer, styles), identified by name. A tenant-specific theme overrides the global one with the same name.
  - name: theme-batch
    description: Massive operations for theme
  - name: theme-audit
    description: Audit operations for changes on theme
  - name: theme-acl
    description: Access control for theme
  - name: template-asset
    description: File (image, stylesheet, font) used by a template, which a tenant can override (e.g. a different logo per tenant in a global template).
  - name: template-asset-batch
    description: Massive operations for template asset
  - name: template-asset-audit
    description: Audit operations for changes on template asset
  - name: template-asset-acl
    description: Access control for template asset
  - name: tenant
    description: Organization with its own users, clients and configuration, isolated from the other tenants. The root tenant manages the global resources.
  - name: tenant-batch
    description: Massive operations for tenant
  - name: tenant-audit
    description: Audit operations for changes on tenant
  - name: tenant-acl
    description: Access control for tenant
  - name: user-federated-identity
    description: Link between a user and their account in an external identity provider, so that signing in with that provider resolves to the user.
  - name: user-federated-identity-batch
    description: Massive operations for user federated identity
  - name: user-federated-identity-audit
    description: Audit operations for changes on user federated identity
  - name: user-federated-identity-acl
    description: Access control for user federated identity
  - name: message
    description: Outbox entry for an outgoing notification (currently an email) the rendered content waits here until the dispatcher sends it, retrying on failure.
  - name: message-batch
    description: Massive operations for message
  - name: message-audit
    description: Audit operations for changes on message
  - name: message-acl
    description: Access control for message
  - name: theme-asset
    description: File (image, stylesheet, font) of a theme, served under {{theme_assets_path}}.
  - name: theme-asset-batch
    description: Massive operations for theme asset
  - name: theme-asset-audit
    description: Audit operations for changes on theme asset
  - name: theme-asset-acl
    description: Access control for theme asset
  - name: tenant-config
    description: Settings of a tenant sign-up, sign-in, MFA, token lifetimes, dynamic client registration and notification emails.
  - name: tenant-config-batch
    description: Massive operations for tenant config
  - name: tenant-config-audit
    description: Audit operations for changes on tenant config
  - name: tenant-config-acl
    description: Access control for tenant config
  - name: user-role-assignment
    description: Roles a user holds, globally or for a specific resource server or client.
  - name: user-role-assignment-batch
    description: Massive operations for user role assignment
  - name: user-role-assignment-audit
    description: Audit operations for changes on user role assignment
  - name: user-role-assignment-acl
    description: Access control for user role assignment
  - name: consent-purpose
    description: Purpose of data processing a tenant asks its users to consent to (marketing, analytics...), as required by the GDPR.
  - name: consent-purpose-batch
    description: Massive operations for consent purpose
  - name: consent-purpose-audit
    description: Audit operations for changes on consent purpose
  - name: consent-purpose-acl
    description: Access control for consent purpose
  - name: smtp-outbound-config
    description: SMTP server used to send notifications. A tenant can have its own configuration; otherwise the global one (without tenant) is used.
  - name: smtp-outbound-config-batch
    description: Massive operations for smtp outbound config
  - name: smtp-outbound-config-audit
    description: Audit operations for changes on smtp outbound config
  - name: smtp-outbound-config-acl
    description: Access control for smtp outbound config
  - name: tenant-login-provider
    description: Represents a login identity provider (e.g., Google, GitHub, SAML) configured for a tenant. Enables federated authentication integration.
  - name: tenant-login-provider-batch
    description: Massive operations for tenant login provider
  - name: tenant-login-provider-audit
    description: Audit operations for changes on tenant login provider
  - name: tenant-login-provider-acl
    description: Access control for tenant login provider
  - name: resource-server
    description: API protected by the authorization server. Clients request access tokens with this resource server as audience, and roles can be defined per resource server.
  - name: resource-server-batch
    description: Massive operations for resource server
  - name: resource-server-audit
    description: Audit operations for changes on resource server
  - name: resource-server-acl
    description: Access control for resource server
  - name: tenant-terms-of-use
    description: Version of the terms of use of a tenant that users must accept, optionally for a single resource server.
  - name: tenant-terms-of-use-batch
    description: Massive operations for tenant terms of use
  - name: tenant-terms-of-use-audit
    description: Audit operations for changes on tenant terms of use
  - name: tenant-terms-of-use-acl
    description: Access control for tenant terms of use
  - name: dcr-initial-access-token
    description: Initial access token that authorizes dynamic client registration in a tenant whose policy is token_required (RFC 7591).
  - name: dcr-initial-access-token-batch
    description: Massive operations for dcr initial access token
  - name: dcr-initial-access-token-audit
    description: Audit operations for changes on dcr initial access token
  - name: dcr-initial-access-token-acl
    description: Access control for dcr initial access token
  - name: user
    description: Person who signs in to a tenant, with a password, a federated identity provider, passkeys or a second factor.
  - name: user-batch
    description: Massive operations for user
  - name: user-audit
    description: Audit operations for changes on user
  - name: user-acl
    description: Access control for user

