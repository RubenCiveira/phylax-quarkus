          description: Rendered content to send, as JSON with subject, html and text; when it is not valid JSON it is sent as raw HTML.
          type: string
        retries:
          description: Failed delivery attempts so far; the message is abandoned once it reaches the max-retries of the SMTP configuration.
          type: integer
          format: int32
        createdAt:
          description: When the message was queued.
          type: string
          format: date-time
        sendAt:
          description: Earliest time to send the message; empty sends it in the next dispatch cycle.
          type: string
          format: date-time
        lockAt:
          description: When a dispatcher took the message to send it; a lock older than two minutes is considered abandoned and the message becomes eligible again.
          type: string
          format: date-time
        version:
          description: Campo con el número de version de message para controlar bloqueos optimistas
          type: integer
          format: int32
