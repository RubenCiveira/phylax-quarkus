    ObservedEmbedApiDto:
      type: object
      description: Read only permission to embed a dashboard or a panel outside the viewer (a wall screen, an internal wiki). It never gives access to the viewer it serves only what it points to, from the allowed origins, until it expires or is disabled.
      properties:
        uid:
          description: Unique identifier of the embed.
          type: string
        name:
          description: What the embed is for (operations screen, internal wiki...).
          type: string
        dashboard:
          $ref: '#/components/schemas/ObservedDashboardApiRef'
        panelUid:
          description: Identifier of one panel of the dashboard to embed only that panel; empty to embed the whole dashboard.
          type: string
        origin:
          $ref: '#/components/schemas/ObservedSourceApiRef'
        tokenHash:
          description: Digest of the token of the embed; the raw value is shown only when it is created or rotated.
          type: string
        allowedOrigins:
          description: Comma-separated web origins (scheme://host:port) that can embed it (frame-ancestors and CORS).
          type: string
        maxRange:
          description: Largest time range that can be queried through the embed.
          type: string
          enum: [hour,six-hours,day,week,month]
        minRefresh:
          description: Seconds the server caches the answers of the embed, so many viewers do not load the store.
          type: integer
          format: int32
        allowRaw:
          description: False only aggregates (metrics, counts) are served. True also the panels of logs, traces and issues.
          type: boolean
        expiresAt:
          description: When the embed stops working; empty for no expiration.
          type: string
          format: date-time
        lastUsedAt:
          description: When the embed was last served.
          type: string
          format: date-time
        enabled:
          description: A disabled embed is rejected, without deleting it.
          type: boolean
        version:
          description: Campo con el número de version de observed embed para controlar bloqueos optimistas
          type: integer
          format: int32
    ObservedEmbedApiDtoList:
