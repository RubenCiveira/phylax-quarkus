# @autogenerated
openapi: 3.0.1
info:
  title: OpenAPI definition
  version: 0.1.1
  contact:
    name: Ruben
  license:
    name: apache
servers:
- url: https://{host}:{port}/{basePath}
  description: The production API server
  variables:
    host:
      default: localhost
      description: this value is assigned by the service provider, in this example `gigantic-server.com`
    port:
      enum:
        - '8090'
      default: '8090'
    basePath:
      default: ''
security:
  - BearerAuth: [] # Aplica el esquema de seguridad por defecto a toda la API
tags:
  - name: snippet
    description: Reusable fragment (legal footer, privacy notice, company address) that templates include by code. A tenant-specific snippet overrides the global one with the same code.
  - name: snippet-batch
    description: Massive operations for snippet
  - name: snippet-audit
    description: Audit operations for changes on snippet
  - name: snippet-acl
    description: Access control for snippet
  - name: user-group-membership
    description: Groups a user belongs to, globally or for a specific resource server or client; published in the tokens.
  - name: user-group-membership-batch
    description: Massive operations for user group membership
  - name: user-group-membership-audit
    description: Audit operations for changes on user group membership
  - name: user-group-membership-acl
    description: Access control for user group membership
  - name: oauth-client
    description: Application that signs users in or requests tokens through OAuth 2.0 / OpenID Connect. The client is sent in every authorization request, so the tenant is resolved from it.
  - name: oauth-client-batch
    description: Massive operations for oauth client
  - name: oauth-client-audit
    description: Audit operations for changes on oauth client
  - name: oauth-client-acl
    description: Access control for oauth client
  - name: observed-alert-rule
    description: Rule that turns what the collector sees into a notification a new issue, a regression, an error rate above a threshold, a source that stops sending or a collector that drops events. Each rule has its channel (log, webhook or email) and avoids repeated notices with its cooldown.
  - name: observed-alert-rule-batch
    description: Massive operations for observed alert rule
  - name: observed-alert-rule-audit
    description: Audit operations for changes on observed alert rule
  - name: observed-alert-rule-acl
    description: Access control for observed alert rule
  - name: api-key-client
    description: Application that accesses the APIs with an API key instead of OAuth tokens.
  - name: api-key-client-batch
    description: Massive operations for api key client
  - name: api-key-client-audit
    description: Audit operations for changes on api key client
  - name: api-key-client-acl
    description: Access control for api key client
  - name: user-personal-api-key
    description: A personal API key (PAT) scoped to a specific user. The raw key is shown to the user only at creation time and is never stored. Subsequent authentication searches by its digest (HMAC with pepper) and compares it in constant time.
  - name: user-personal-api-key-batch
    description: Massive operations for user personal api key
  - name: user-personal-api-key-audit
    description: Audit operations for changes on user personal api key
  - name: user-personal-api-key-acl
    description: Access control for user personal api key
  - name: tenant
    description: Organization with its own users, clients and configuration, isolated from the other tenants. The root tenant manages the global resources.
  - name: tenant-batch
    description: Massive operations for tenant
  - name: tenant-audit
    description: Audit operations for changes on tenant
  - name: tenant-acl
    description: Access control for tenant
  - name: observed-alert
    description: A problem detected by an alert rule it stays FIRING while the condition holds and becomes RESOLVED when it ends. There is at most one open alert per rule and problem key (the issue, the origin...). Created and closed by the collector, never by hand.
  - name: observed-alert-batch
    description: Massive operations for observed alert
  - name: observed-alert-audit
    description: Audit operations for changes on observed alert
  - name: observed-alert-acl
    description: Access control for observed alert
  - name: user-federated-identity
    description: Link between a user and their account in an external identity provider, so that signing in with that provider resolves to the user.
  - name: user-federated-identity-batch
    description: Massive operations for user federated identity
  - name: user-federated-identity-audit
    description: Audit operations for changes on user federated identity
  - name: user-federated-identity-acl
    description: Access control for user federated identity
  - name: observed-dashboard
    description: Grid of panels of the viewer, each one a chart with its query. A template dashboard (source-variable) is applied to the origin chosen in the viewer. The builtin dashboards are seeded by the install of the trait they are not edited, they are duplicated.
  - name: observed-dashboard-batch
    description: Massive operations for observed dashboard
  - name: observed-dashboard-audit
    description: Audit operations for changes on observed dashboard
  - name: observed-dashboard-acl
    description: Access control for observed dashboard
  - name: observed-issue-comment
    description: Comment of a person on an issue findings, links, decisions. Written from the viewer by the WRITE level.
  - name: observed-issue-comment-batch
    description: Massive operations for observed issue comment
  - name: observed-issue-comment-audit
    description: Audit operations for changes on observed issue comment
  - name: observed-issue-comment-acl
    description: Access control for observed issue comment
  - name: consent-purpose
    description: Purpose of data processing a tenant asks its users to consent to (marketing, analytics...), as required by the GDPR.
  - name: consent-purpose-batch
    description: Massive operations for consent purpose
  - name: consent-purpose-audit
    description: Audit operations for changes on consent purpose
  - name: consent-purpose-acl
    description: Access control for consent purpose
  - name: observability-config
    description: Global configuration of the observability retention of each kind of data, disk limit and the masking of the events. It has a single row (code default), created by the install of the trait; the values of config/observability.yaml are used while it does not exist.
  - name: observability-config-batch
    description: Massive operations for observability config
  - name: observability-config-audit
    description: Audit operations for changes on observability config
  - name: observability-config-acl
    description: Access control for observability config
  - name: observed-issue
    description: Group of identical error events reported by an observed source. Events are grouped automatically by their fingerprint (exception type and first in-app stack frames), so operators triage one issue with its count and first/last occurrence instead of every single event. It is not an alert it is never configured and never notifies. Resolving an issue closes it until the same fingerprint is seen again, which reopens it as a regression.
  - name: observed-issue-batch
    description: Massive operations for observed issue
  - name: observed-issue-audit
    description: Audit operations for changes on observed issue
  - name: observed-issue-acl
    description: Access control for observed issue
  - name: smtp-outbound-config
    description: SMTP server used to send notifications. A tenant can have its own configuration; otherwise the global one (without tenant) is used.
  - name: smtp-outbound-config-batch
    description: Massive operations for smtp outbound config
  - name: smtp-outbound-config-audit
    description: Audit operations for changes on smtp outbound config
  - name: smtp-outbound-config-acl
    description: Access control for smtp outbound config
  - name: dcr-initial-access-token
    description: Initial access token that authorizes dynamic client registration in a tenant whose policy is token_required (RFC 7591).
  - name: dcr-initial-access-token-batch
    description: Massive operations for dcr initial access token
  - name: dcr-initial-access-token-audit
    description: Audit operations for changes on dcr initial access token
  - name: dcr-initial-access-token-acl
    description: Access control for dcr initial access token
  - name: template
    description: Document the system renders for a channel (an email, an SMS or an HTML page), identified by its code. A tenant-specific template overrides the global one with the same code; the content lives in its versions, one per locale.
  - name: template-batch
    description: Massive operations for template
  - name: template-audit
    description: Audit operations for changes on template
  - name: template-acl
    description: Access control for template
  - name: role
    description: Role that can be assigned to users, optionally limited to a resource server.
  - name: role-batch
    description: Massive operations for role
  - name: role-audit
    description: Audit operations for changes on role
  - name: role-acl
    description: Access control for role
  - name: theme-version
    description: Layout of a theme for a channel and a locale, chosen by BCP 47 negotiation like template versions.
  - name: theme-version-batch
    description: Massive operations for theme version
  - name: theme-version-audit
    description: Audit operations for changes on theme version
  - name: theme-version-acl
    description: Access control for theme version
  - name: snippet-version
    description: Content of a snippet for a locale, chosen by BCP 47 negotiation like template versions.
  - name: snippet-version-batch
    description: Massive operations for snippet version
  - name: snippet-version-audit
    description: Audit operations for changes on snippet version
  - name: snippet-version-acl
    description: Access control for snippet version
  - name: template-version
    description: Content of a template for a locale. When rendering, the version is chosen by BCP 47 negotiation exact locale, then language, then the default version.
  - name: template-version-batch
    description: Massive operations for template version
  - name: template-version-audit
    description: Audit operations for changes on template version
  - name: template-version-acl
    description: Access control for template version
  - name: snippet-asset
    description: File (image, stylesheet, font) used by a snippet.
  - name: snippet-asset-batch
    description: Massive operations for snippet asset
  - name: snippet-asset-audit
    description: Audit operations for changes on snippet asset
  - name: snippet-asset-acl
    description: Access control for snippet asset
  - name: observed-slo
    description: Service level objective of an origin, measured on its RED metrics availability (requests without error) or latency (requests faster than latency-ms), with a target in thousandths (995 = 99.5 %) over a window of days. The viewer shows its compliance and remaining error budget, and the slo-burn alert rules notify when the budget is spent too fast.
  - name: observed-slo-batch
    description: Massive operations for observed slo
  - name: observed-slo-audit
    description: Audit operations for changes on observed slo
  - name: observed-slo-acl
    description: Access control for observed slo
  - name: observed-issue-alias
    description: A fingerprint that belongs to another issue when two issues are merged, the fingerprint of the merged one points to the one that stays, so its new events count there.
  - name: observed-issue-alias-batch
    description: Massive operations for observed issue alias
  - name: observed-issue-alias-audit
    description: Audit operations for changes on observed issue alias
  - name: observed-issue-alias-acl
    description: Access control for observed issue alias
  - name: template-variable
    description: Default value of a variable available to the templates of a tenant; the caller can override it when rendering.
  - name: template-variable-batch
    description: Massive operations for template variable
  - name: template-variable-audit
    description: Audit operations for changes on template variable
  - name: template-variable-acl
    description: Access control for template variable
  - name: theme
    description: Layout shared by several templates (header, footer, styles), identified by name. A tenant-specific theme overrides the global one with the same name.
  - name: theme-batch
    description: Massive operations for theme
  - name: theme-audit
    description: Audit operations for changes on theme
  - name: theme-acl
    description: Access control for theme
  - name: observed-fingerprint-rule
    description: Rule that corrects the automatic grouping of the errors group-as puts in one issue the events whose field matches the pattern; ignore-frame leaves the matching stack frames out of the fingerprint (wrappers, retries); drop keeps the events as logs but never as issues (noise of bots or browser extensions).
  - name: observed-fingerprint-rule-batch
    description: Massive operations for observed fingerprint rule
  - name: observed-fingerprint-rule-audit
    description: Audit operations for changes on observed fingerprint rule
  - name: observed-fingerprint-rule-acl
    description: Access control for observed fingerprint rule
  - name: template-asset
    description: File (image, stylesheet, font) used by a template, which a tenant can override (e.g. a different logo per tenant in a global template).
  - name: template-asset-batch
    description: Massive operations for template asset
  - name: template-asset-audit
    description: Audit operations for changes on template asset
  - name: template-asset-acl
    description: Access control for template asset
  - name: observed-probe
    description: Active check of a URL the collector calls it every interval-seconds and records whether it answers the expected status (and text) in time, and when its TLS certificate expires. It detects a service that is down even when nobody is using it. Only http(s) URLs of the allowed hosts are called, and redirects are never followed.
  - name: observed-probe-batch
    description: Massive operations for observed probe
  - name: observed-probe-audit
    description: Audit operations for changes on observed probe
  - name: observed-probe-acl
    description: Access control for observed probe
  - name: message
    description: Outbox entry for an outgoing notification (currently an email) the rendered content waits here until the dispatcher sends it, retrying on failure.
  - name: message-batch
    description: Massive operations for message
  - name: message-audit
    description: Audit operations for changes on message
  - name: message-acl
    description: Access control for message
  - name: observed-source
    description: Origin allowed to send telemetry (logs and traces) the application itself, a client application or an api. It is the only table the ingestion checks. The rows of the referenced entities (oauth clients, resource servers) are created and updated by the synchronization of the trait; the others are created by hand. It is not tenant data only the managers of the platform see it.
  - name: observed-source-batch
    description: Massive operations for observed source
  - name: observed-source-audit
    description: Audit operations for changes on observed source
  - name: observed-source-acl
    description: Access control for observed source
  - name: theme-asset
    description: File (image, stylesheet, font) of a theme, served under {{theme_assets_path}}.
  - name: theme-asset-batch
    description: Massive operations for theme asset
  - name: theme-asset-audit
    description: Audit operations for changes on theme asset
  - name: theme-asset-acl
    description: Access control for theme asset
  - name: tenant-config
    description: Settings of a tenant sign-up, sign-in, MFA, token lifetimes, dynamic client registration and notification emails.
  - name: tenant-config-batch
    description: Massive operations for tenant config
  - name: tenant-config-audit
    description: Audit operations for changes on tenant config
  - name: tenant-config-acl
    description: Access control for tenant config
  - name: user-role-assignment
    description: Roles a user holds, globally or for a specific resource server or client.
  - name: user-role-assignment-batch
    description: Massive operations for user role assignment
  - name: user-role-assignment-audit
    description: Audit operations for changes on user role assignment
  - name: user-role-assignment-acl
    description: Access control for user role assignment
  - name: tenant-login-provider
    description: Represents a login identity provider (e.g., Google, GitHub, SAML) configured for a tenant. Enables federated authentication integration.
  - name: tenant-login-provider-batch
    description: Massive operations for tenant login provider
  - name: tenant-login-provider-audit
    description: Audit operations for changes on tenant login provider
  - name: tenant-login-provider-acl
    description: Access control for tenant login provider
  - name: resource-server
    description: API protected by the authorization server. Clients request access tokens with this resource server as audience, and roles can be defined per resource server.
  - name: resource-server-batch
    description: Massive operations for resource server
  - name: resource-server-audit
    description: Audit operations for changes on resource server
  - name: resource-server-acl
    description: Access control for resource server
  - name: tenant-terms-of-use
    description: Version of the terms of use of a tenant that users must accept, optionally for a single resource server.
  - name: tenant-terms-of-use-batch
    description: Massive operations for tenant terms of use
  - name: tenant-terms-of-use-audit
    description: Audit operations for changes on tenant terms of use
  - name: tenant-terms-of-use-acl
    description: Access control for tenant terms of use
  - name: observed-embed
    description: Read only permission to embed a dashboard or a panel outside the viewer (a wall screen, an internal wiki). It never gives access to the viewer it serves only what it points to, from the allowed origins, until it expires or is disabled.
  - name: observed-embed-batch
    description: Massive operations for observed embed
  - name: observed-embed-audit
    description: Audit operations for changes on observed embed
  - name: observed-embed-acl
    description: Access control for observed embed
  - name: user
    description: Person who signs in to a tenant, with a password, a federated identity provider, passkeys or a second factor.
  - name: user-batch
    description: Massive operations for user
  - name: user-audit
    description: Audit operations for changes on user
  - name: user-acl
    description: Access control for user

paths:
  /api/document/snippet:
    get:
      tags:
        - snippet
      summary: List of snippet
      operationId: snippet-api-list
      parameters:
        - name: uids
          in: query
          description: Filter by a list of ids
          required: false
          schema:
            type: array
            items:
              type: string
          style: form
          explode: false
        - name: search
          in: query
          description: Textual search
          required: false
          schema:
            type: string
        - name: global
          in: query
          description: global
          required: false
          schema:
            type: boolean
        - name: code
          in: query
          description: code
          required: false
          schema:
            type: string
        - name: tenant
          in: query
          description: tenant
          required: false
          schema:
            type: string
        - name: tenants
          in: query
          description: tenants
          required: false
          schema:
            type: array
            items: 
              type: string
          style: form
          explode: false
        - name: limit
          in: query
          description: The maximum number of results
          required: false
          schema:
            type: integer
        - name: since-uid
          in: query
          description: The maximum number of results
          required: false
          schema:
            type: string
        - name: since-code
          in: query
          description: Order by code asc
          required: false
          schema:
            type: string
        - name: order
          in: query
          description: The result order information
          required: false
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SnippetApiDtoList'
    post:
      tags:
        - snippet
      summary: Create a new snippet
      operationId: snippet-api-create
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SnippetApiDto'
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SnippetApiDto'
    delete:
      tags:
        - snippet-batch
      summary: Delete a collection of snippet by filter
      operationId: snippet-api-batch-delete
      parameters:
        - name: uids
          in: query
          description: Filter by a list of ids
          required: false
          schema:
            type: array
            items:
              type: string
          style: form
          explode: false
        - name: search
          in: query
          description: Textual search
          required: false
          schema:
            type: string
        - name: global
          in: query
          description: global
          required: false
          schema:
            type: boolean
        - name: code
          in: query
          description: code
          required: false
          schema:
            type: string
        - name: tenant
          in: query
          description: tenant
          required: false
          schema:
            type: string
        - name: tenants
          in: query
          description: tenants
          required: false
          schema:
            type: array
            items: 
              type: string
          style: form
          explode: false
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BatchTaskLocator'
  /api/document/snippet/{uid}:
    get:
      tags:
        - snippet
      summary: Retrieve on  snippet by their uid
      operationId: snippet-api-retrieve
      parameters:
        - name: uid
          in: path
          description: The iten identification
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SnippetApiDto'
        '404':
          description: The item dont exists
    put:
      tags:
        - snippet
      summary: Update a snippet by their uid
      operationId: snippet-api-update
      parameters:
        - name: uid
          in: path
          description: The iten identification
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SnippetApiDto'
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SnippetApiDto'
        '404':
          description: The item dont exists
    delete:
      tags:
        - snippet
      summary: Delete a  snippet by their uid
      operationId: snippet-api-delete
      parameters:
        - name: uid
          in: path
          description: The iten identification
          required: true
          schema:
            type: string
      responses:
        '204':
          description: OK
        '404':
          description: The item dont exists
  /api/document/snippet/~/delete-status/{uid}:
    get:
      tags:
        - snippet-batch
      summary: Query the result of an massive delete
      operationId: snippet-api-batch-delete-query
      parameters:
        - name: uid
          in: path
          description: The iten identification
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BatchTaskDetail'
        '404':
          description: The item dont exists
  /api/document/snippet/-/audit/entity/{uid}:
    get:
      tags:
        - snippet-audit
      summary: Update a snippet by their uid
      operationId: snippet-api-entity-audit
      parameters:
        - name: uid
          in: path
          description: The iten identification
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AuditEventDto'
        '404':
          description: The item dont exists
  /api/document/snippet/-/audit/actor/{actor}/{from}/{to}:
    get:
      tags:
        - snippet-audit
      summary: Update a snippet by their uid
      operationId: snippet-api-actor-audit
      parameters:
        - name: actor
          in: path
          description: The iten identification
          required: true
          schema:
            type: string
        - name: from
          in: path
          description: The iten identification
          required: true
          schema:
            type: string
            format: date
        - name: to
          in: path
          description: The iten identification
          required: true
          schema:
            type: string
            format: date
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AuditEventDto'
        '404':
          description: The item dont exists
  /api/document/snippet/{uid}/enable:
    patch:
      tags:
        - snippet
      summary: Update a snippet by their uid
      operationId: snippet-api-enable
      parameters:
        - name: uid
          in: path
          description: The iten identification
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SnippetApiDto'
        '404':
          description: The item dont exists
  /api/document/snippet/{uid}/disable:
    patch:
      tags:
        - snippet
      summary: Update a snippet by their uid
      operationId: snippet-api-disable
      parameters:
        - name: uid
          in: path
          description: The iten identification
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SnippetApiDto'
        '404':
          description: The item dont exists
  /api/me/acl/document/snippet:
    get:
      tags:
        - snippet-acl
      summary: Check for allow permissions for the current user on snippet
      operationId: snippet-api-generic-acl
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SnippetGenericAcl'
  /api/me/acl/document/snippet/{uid}:
    get:
      tags:
        - snippet-acl
      summary: Check for allow permissions for the current user on snippet by their uid
      operationId: snippet-api-contextual-acl
      parameters:
        - name: uid
          in: path
          description: The iten identification
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SnippetSpecificAcl'
        '404':
          description: The item dont exists
  /api/document/snippet/~/enable:
    patch:
      tags:
        - snippet-batch
      summary: enable a collection of snippet by filter
      operationId: snippet-api-batch-enable
      parameters:
        - name: uids
          in: query
          description: Filter by a list of ids
          required: false
          schema:
            type: array
            items:
              type: string
          style: form
          explode: false
        - name: search
          in: query
          description: Textual search
          required: false
          schema:
            type: string
        - name: global
          in: query
          description: global
          required: false
          schema:
            type: boolean
        - name: code
          in: query
          description: code
          required: false
          schema:
            type: string
        - name: tenant
          in: query
          description: tenant
          required: false
          schema:
            type: string
        - name: tenants
          in: query
          description: tenants
          required: false
          schema:
            type: array
            items: 
              type: string
          style: form
          explode: false
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BatchTaskLocator'
  /api/document/snippet/~/enable-status/{uid}:
    get:
