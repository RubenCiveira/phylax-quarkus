    SmtpOutboundConfigApiDto:
      type: object
      description: SMTP server used to send notifications. A tenant can have its own configuration; otherwise the global one (without tenant) is used.
      properties:
        uid:
          description: Unique identifier of the configuration.
          type: string
        tenant:
          $ref: '#/components/schemas/TenantApiRef'
        host:
          description: Host name or IP address of the SMTP server.
          type: string
        port:
          description: Port of the SMTP server (usually 587 with STARTTLS or 465 with implicit TLS).
          type: integer
          format: int32
        login:
          description: User name to authenticate against the SMTP server.
          type: string
        password:
          description: Password to authenticate against the SMTP server; stored encrypted.
          type: string
        senderName:
          description: Display name shown as the sender of the emails.
          type: string
        senderEmail:
          description: Address used as the sender (From) of the emails.
          type: string
        timeout:
          description: Connection and write timeout against the SMTP server, in seconds.
          type: integer
          format: int32
        useTls:
          description: Encrypts the connection to the SMTP server with TLS.
          type: boolean
        maxRetries:
          description: Delivery attempts before a message is abandoned.
          type: integer
          format: int32
        retryDelay:
          description: Seconds to wait before retrying a failed delivery.
          type: integer
          format: int32
        rateLimit:
          description: Maximum number of emails sent per dispatch cycle with this configuration.
          type: integer
          format: int32
        version:
