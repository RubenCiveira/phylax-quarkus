        version:
          description: Campo con el número de version de oauth client allowed audience para controlar bloqueos optimistas
          type: integer
          format: int32
    OauthClientApiDto:
      type: object
      description: Application that signs users in or requests tokens through OAuth 2.0 / OpenID Connect. The client is sent in every authorization request, so the tenant is resolved from it.
      properties:
        uid:
          description: Unique identifier of the client.
          type: string
        code:
          description: Client identifier (client_id) used in the OAuth requests.
          type: string
        tenant:
          $ref: '#/components/schemas/TenantApiRef'
        allowAllScopes:
          description: Lets the client request any scope instead of only the standard OpenID Connect ones.
          type: boolean
        tokenEndpointAuthMethod:
          description: How the client authenticates at the token endpoint client secret in the Authorization header or in the body, a signed JWT (private_key_jwt), or none for public clients.
          type: string
          enum: [client-secret-basic,client-secret-post,private-key-jwt,none]
        tokenEndpointAuthSigningAlg:
          description: Algorithm the client uses to sign the JWT with which it authenticates at the token endpoint.
          type: string
        dpopBoundAccessTokens:
          description: Requires the access tokens of this client to be bound to a DPoP key (RFC 9449).
          type: boolean
        idTokenSignedResponseAlg:
          description: Algorithm used to sign the ID tokens issued to this client.
          type: string
          enum: [rs256,es256,eddsa]
        tlsClientAuthSubjectDn:
          description: Expected subject DN of the client certificate for mutual-TLS client authentication (RFC 8705).
          type: string
        tlsClientCertificateBoundAccessTokens:
          description: Binds the access tokens of this client to its TLS client certificate (RFC 8705).
          type: boolean
        authorizationSignedResponseAlg:
          description: Algorithm used to sign JWT-secured authorization responses (JARM) for this client.
          type: string
        backchannelTokenDeliveryMode:
          description: How tokens are delivered in the CIBA flow the client polls the token endpoint, or receives a ping.
          type: string
          enum: [poll,ping]
        backchannelClientNotificationEndpoint:
          description: Endpoint of the client that receives the CIBA ping notifications.
          type: string
        subjectType:
          description: Subject identifier sent to the client the same for every client (public) or a different one per sector (pairwise).
          type: string
          enum: [public,pairwise]
        idTokenEncryptedResponseAlg:
          description: Key management algorithm used to encrypt the ID tokens of this client; empty sends them unencrypted.
          type: string
        idTokenEncryptedResponseEnc:
          description: Content encryption algorithm used to encrypt the ID tokens of this client.
          type: string
        userinfoEncryptedResponseAlg:
          description: Key management algorithm used to encrypt the userinfo responses of this client; empty sends them unencrypted.
          type: string
        userinfoEncryptedResponseEnc:
          description: Content encryption algorithm used to encrypt the userinfo responses of this client.
          type: string
        authorizationDetailsTypes:
          description: JSON list of the authorization_details types the client can request (RFC 9396).
          type: string
        userinfoSignedResponseAlg:
          description: Algorithm used to sign the userinfo responses; empty returns them as plain JSON.
          type: string
        secretOauth:
          description: Client secret; only its digest is stored.
          type: string
        registrationAccessToken:
          description: Token the client uses to manage its own registration (RFC 7592); only its digest is stored.
          type: string
        defaultAcrValues:
          description: Authentication context class (ACR) values requested by default when the client does not send acr_values.
          type: string
        defaultMaxAge:
          description: Maximum authentication age, in seconds, applied when the client does not send max_age.
          type: integer
          format: int32
        sectorIdentifierUri:
          description: URL listing the redirect URIs of the clients that share pairwise subject identifiers.
          type: string
        allowedLoginRedirects:
          description: Redirect URIs the client may use after sign-in.
          type: array
          items:
            $ref: '#/components/schemas/AllowedLoginRedirectsApiDto'
        allowedLogoutRedirects:
          description: Redirect URIs the client may use after sign-out.
          type: array
          items:
            $ref: '#/components/schemas/AllowedLogoutRedirectsApiDto'
        allowedAudiences:
          description: Audiences (resource servers or resource URIs) the client may request tokens for.
          type: array
          items:
            $ref: '#/components/schemas/AllowedAudiencesApiDto'
        grantTypesJson:
          description: JSON list of the grant types the client may use.
          type: string
        introspectionAllowed:
          description: If true, this client is allowed to call the token introspection endpoint (POST /introspect) to validate access tokens. Resource servers must authenticate at the introspection endpoint using their client credentials.
          type: boolean
        requirePushedAuthorizationRequests:
          description: Requires the client to send its authorization requests through PAR (RFC 9126).
          type: boolean
        requirePkce:
          description: If true, every authorization code request from this client must include code_challenge and code_challenge_method=S256. For clients with public-allow=true, PKCE is always required regardless of this flag.
          type: boolean
        backchannelLogoutUri:
          description: Endpoint of the client that receives back-channel logout notifications.
          type: string
        backchannelLogoutSessionRequired:
          description: Includes the session identifier (sid) in the back-channel logout token.
          type: boolean
        frontchannelLogoutUri:
          description: URL of the client loaded in the browser to sign the user out (front-channel logout).
          type: string
        frontchannelLogoutSessionRequired:
          description: Adds the issuer and session identifier to the front-channel logout URL.
          type: boolean
        enabled:
          description: A disabled client cannot sign in users or obtain tokens, without deleting it.
          type: boolean
        clientName:
          description: Name of the client shown to users, for example on the consent screen.
          type: string
        logoUri:
          description: URL of the client logo shown to users.
          type: string
        clientUri:
          description: URL of the home page of the client.
          type: string
        policyUri:
          description: URL of the privacy policy of the client.
          type: string
        tosUri:
          description: URL of the terms of service of the client.
          type: string
        responseTypesJson:
          description: JSON list of the response types the client may request.
          type: string
        dynamicallyRegistered:
          description: The client was created through dynamic client registration (RFC 7591).
          type: boolean
        registeredAt:
          description: When the client was registered.
          type: string
          format: date-time
        clientCredentialsScopes:
          description: Scopes granted to the client in the client credentials flow.
          type: string
        clientCredentialsTokenTtlSeconds:
          description: Lifetime, in seconds, of the access tokens issued in the client credentials flow.
          type: integer
          format: int32
        requestObjectSigningAlg:
          description: Algorithm the client must use to sign request objects.
          type: string
        jwksUri:
          description: URL of the JSON Web Key Set with the public keys of the client.
          type: string
        jwksJson:
          description: JSON Web Key Set with the public keys of the client, when it does not publish a jwks-uri.
          type: string
        version:
          description: Campo con el número de version de oauth client para controlar bloqueos optimistas
          type: integer
          format: int32
