    ObservabilityConfigApiDto:
      type: object
      description: Global configuration of the observability retention of each kind of data, disk limit and the masking of the events. It has a single row (code default), created by the install of the trait; the values of config/observability.yaml are used while it does not exist.
      properties:
        uid:
          description: Unique identifier of the configuration.
          type: string
        code:
          description: Code of the configuration; there is only one, named default.
          type: string
        retentionDaysLogs:
          description: Days the logs are kept.
          type: integer
          format: int32
        retentionDaysTraces:
          description: Days the spans are kept.
          type: integer
          format: int32
        retentionDaysErrors:
          description: Days the raw error events are kept; the issues do not expire.
          type: integer
          format: int32
        retentionDaysMetrics:
          description: Days the metric points of one minute resolution are kept.
          type: integer
          format: int32
        retentionDaysMetricsRollup:
          description: Days the metric points of one hour resolution are kept, to compare with the previous year.
          type: integer
          format: int32
        maxDiskMb:
          description: Hard limit of the store, in megabytes above it the purge deletes the oldest days even inside their retention.
          type: integer
          format: int32
        scrubFields:
          description: Comma-separated keys whose values are masked in every event before it is stored.
          type: string
        labelDenylist:
          description: Comma-separated metric labels discarded on arrival, to keep the number of series bounded.
          type: string
        captureRequestBody:
          description: Stores the body of the requests in the spans of the application (masked with scrub-fields).
          type: boolean
        version:
          description: Campo con el número de version de observability config para controlar bloqueos optimistas
          type: integer
          format: int32
    ObservabilityConfigApiDtoList:
