    ObservedFingerprintRuleApiDto:
      type: object
      description: Rule that corrects the automatic grouping of the errors group-as puts in one issue the events whose field matches the pattern; ignore-frame leaves the matching stack frames out of the fingerprint (wrappers, retries); drop keeps the events as logs but never as issues (noise of bots or browser extensions).
      properties:
        uid:
          description: Unique identifier of the rule.
          type: string
        name:
          description: Name of the rule.
          type: string
        origin:
          $ref: '#/components/schemas/ObservedSourceApiRef'
        field:
          description: Field the pattern is checked against the message, the exception type or each stack frame.
          type: string
          enum: [message,type,frame]
        pattern:
          description: Regular expression (Java syntax, at most 200 characters; an expression that takes too long is ignored).
          type: string
        effect:
          description: group-as one issue for every matching event. ignore-frame the matching frames do not count in the fingerprint. drop no issue (the logs stay).
          type: string
          enum: [group-as,ignore-frame,drop]
        groupKey:
          description: For group-as name of the group (the events of every rule with the same key go together); empty the rule itself.
          type: string
        enabled:
          description: A disabled rule is not applied.
          type: boolean
        version:
          description: Campo con el número de version de observed fingerprint rule para controlar bloqueos optimistas
          type: integer
          format: int32
