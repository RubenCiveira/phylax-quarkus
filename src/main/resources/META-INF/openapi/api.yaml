    ObservedProbeApiDto:
      type: object
      description: Active check of a URL the collector calls it every interval-seconds and records whether it answers the expected status (and text) in time, and when its TLS certificate expires. It detects a service that is down even when nobody is using it. Only http(s) URLs of the allowed hosts are called, and redirects are never followed.
      properties:
        uid:
          description: Unique identifier of the probe.
          type: string
        name:
          description: Name of the probe.
          type: string
        origin:
          $ref: '#/components/schemas/ObservedSourceApiRef'
        url:
          description: URL to call (http or https); its host must be in app.observe.probes.allowed-hosts.
          type: string
        method:
          description: HTTP method of the check.
          type: string
          enum: [get,head,post]
        expectedStatus:
          description: HTTP status a healthy check answers.
          type: integer
          format: int32
        expectedText:
          description: Text the body must contain; empty to check only the status.
          type: string
        timeoutMs:
          description: Maximum time of the check, in milliseconds.
          type: integer
          format: int32
        intervalSeconds:
          description: Seconds between two checks (at least 30).
          type: integer
          format: int32
        failuresToAlert:
          description: Consecutive failed checks before the probe-down alert rules fire.
          type: integer
          format: int32
        tlsWarnDays:
          description: Days before the expiration of the certificate when the tls-expiring alert rules fire.
          type: integer
          format: int32
        lastStatus:
          description: Result of the last check UP or DOWN.
          type: string
          enum: [up,down]
        lastCheckedAt:
          description: When the last check was made.
          type: string
          format: date-time
        lastLatencyMs:
          description: Duration of the last check, in milliseconds.
          type: integer
          format: int32
        consecutiveFailures:
          description: Failed checks in a row (0 after a good one).
          type: integer
          format: int32
        lastError:
          description: Why the last check failed (status, text, timeout, host not allowed...).
          type: string
        tlsExpiresAt:
          description: Expiration of the TLS certificate of the last https check.
          type: string
          format: date-time
        enabled:
          description: A disabled probe is not called.
          type: boolean
        version:
          description: Campo con el número de version de observed probe para controlar bloqueos optimistas
          type: integer
          format: int32
