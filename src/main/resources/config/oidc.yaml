# OIDC provider configuration. Only the values set here; the rest keep the code defaults:
#   oidc.base-url               public host for links and WebAuthn origins (empty: from the request)
#   oidc.jwt.expiration.id-token, oidc.jwt.access-token.rfc9068, oidc.par.flow-ttl,
#   oidc.pkce.require-for-confidential, oidc.ui-locales
#   oidc.pairwise.salt          (env OIDC_PAIRWISE_SALT) salt of pairwise subjects; unset, no
#                               client can be pairwise
oidc:
  jwt:
    authorization:
      store-pass: zfqvjnxl
      store-pair: jwpair
      key-duration: 3d
      key-futures: 5
    expiration:
      mfa-token: 3m
      access-token: 5m

quarkus:
  http:
    filter:
      oauth-themes:
        header:
          Cache-Control: public, max-age=31536000, s-maxage=31536000
        methods:
        - GET
        - HEAD
        matches: /oauth/themes/.*
      oauth-assets:
        header:
          Cache-Control: public, max-age=100, s-maxage=100
        methods:
        - GET
        - HEAD
        matches: /oauth/assets/.*
