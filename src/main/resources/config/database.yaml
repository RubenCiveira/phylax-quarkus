quarkus:
  # @FIXME read-replica: este datasource (default) es el primario y lo usa el lado de comandos.
  #   Añadir el datasource con nombre "replica" (quarkus.datasource.replica.*) que inyectan los
  #   *QueryRepositoryAdapter, con valores por defecto iguales a los de este y jdbc.transactions:
  #   disabled para que no se enliste en JTA. No crear un "write" aparte: serían dos pools al
  #   primario y una transacción que usase ambos fallaría (dos recursos no-XA).
  datasource:
    db-kind: mariadb
     # test_read luego, por ahora test_write
    username: ${datasource.user}
    password: ${datasource.pass}
    jdbc:
      url: jdbc:mariadb://${datasource.host:localhost}:${datasource.port:3306}/${datasource.path}
      # url: jdbc:mariadb://localhost/phylax_quarkus
      max-size: 1
      min-size: 1
    replica:
      db-kind: mariadb
      # test_read luego, por ahora test_write
      username: ${datasource.user}
      password: ${datasource.pass}
      jdbc:
        url: jdbc:mariadb://${datasource.host:localhost}:${datasource.port:3306}/${datasource.path}
        transactions: disabled
        # url: jdbc:mariadb://localhost/phylax_quarkus
        max-size: 1
        min-size: 1

app:
  migration:
    db-kind: mariadb
    username: ${datasource.user}
    password: ${datasource.pass}
    group: mysql
    location: migration/mysql/changelog.txt
    jdbc:
      url: jdbc:mariadb://${datasource.host:localhost}:${datasource.port:3306}/${datasource.path}
