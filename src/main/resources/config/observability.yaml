# @autogenerated
# Observability of the trait observable (see docs/TODO/observable-trait.md).
# The login of the viewer is configured in META-INF/resources/observe/config/viewer-config.json;
# its api (/observe/api) is behind the security of the application and asks the roles below.
app:
  observe:
    # Store of logs, spans and metric points: jsonl (files per day) or sql (tables obs_* in the
    # database of the application). In Quarkus it is chosen when building.
    storage: ${OBSERVE_STORAGE:jsonl}
    # Root directory of the JSONL files (one directory per day)
    path: ${OBSERVE_PATH:logs/data/observability}
    # Each file of a day is cut in segments of this size, so the disk limit (max-disk-mb) can free
    # space inside the current day too: above it the oldest days go first, then the oldest segments
    # of today, and if nothing else can go the new events are rejected (counted as dropped).
    segment-mb: ${OBSERVE_SEGMENT_MB:64}
    sourcemaps:
      # Releases of each front whose source maps are kept (0: all)
      keep-releases: 10
    # Initial values of observability-config: the install creates its row "default" with them, and
    # they are used while that row does not exist. Once it exists, the row counts (it is changed
    # from the admin, without restarting).
    defaults:
      retention-days-logs: ${OBSERVE_RETENTION_DAYS:14}
      retention-days-traces: ${OBSERVE_RETENTION_DAYS_TRACES:7}
      retention-days-errors: 90
      retention-days-metrics: 15
      retention-days-metrics-rollup: 400
      # Limit of the whole storage path (days, source maps, patterns); 0 without limit
      max-disk-mb: ${OBSERVE_MAX_DISK_MB:2048}
      # Hours the logs and spans are kept by the level of their trace (the most severe of its logs,
      # or error if a span failed): every row of a trace with an error lives as long as the error.
      # Applied every 15 minutes on top of the days above (the shortest wins); the issues are
      # entities and are never deleted by it.
      retention-hours-debug: 2
      retention-hours-info: 12
      retention-hours-warn: 24
      retention-hours-error: 168
      scrub-fields: password,secret,token,authorization,cookie,set-cookie,api-key
      label-denylist: user,user_id,session,session_id,trace_id,span_id,request_id,email,tenant
      capture-request-body: false
    queue-size: 10000
    flush-interval-ms: 1000
    # The application observes itself as the source self-source (created at startup)
    self: true
    self-source: phylax-api
    # Version and environment of the own logs (the own spans take them from the OpenTelemetry
    # resource; these values are used when it does not have them)
    self-release: ${OBSERVE_SELF_RELEASE:${quarkus.application.version:}}
    self-env: ${OBSERVE_SELF_ENV:}
    # The sources created by the synchronization with oauth-client / resource-server are enabled
    auto-enable: true
    issues:
      # Groups the error logs with an exception in observed-issue (one issue per fingerprint)
      enabled: ${OBSERVE_ISSUES_ENABLED:true}
      # Prefixes of the own Java frames used in the fingerprint, comma separated
      # in-app: com.acme.        (default: the base package of the application)
      # Counts the distinct users and tenants of each issue, pseudonymized (HMAC with this salt;
      # change the salt and the counts start again). false: they are not counted
      track-users: ${OBSERVE_ISSUES_TRACK_USERS:true}
      user-salt: ${OBSERVE_USER_SALT:phylax-api}
    metrics:
      # RED metrics series per source (route + method); the new ones above go to __overflow__
      max-series: 2000
    probes:
      # false in all the replicas but one, so each probe is checked once per interval
      enabled: ${OBSERVE_PROBES_ENABLED:true}
      # Hosts the probes may call, comma separated. Empty: the host of public-url and the hosts of
      # the allowed-origins of the sources. Local and link-local addresses are never called.
      allowed-hosts: ${OBSERVE_PROBES_ALLOWED_HOSTS:}
    sampling:
      # Events per minute a source keeps at most: above it its trace-sample-rate is lowered (the
      # traces with errors are always kept). 0: the rate of each source, fixed
      target-per-minute: ${OBSERVE_SAMPLING_TARGET:0}
    ingest:
      # true: the OTLP endpoints (/v1/traces, /v1/logs) reject the requests without X-Observe-Key
      require-key: ${OBSERVE_REQUIRE_KEY:false}
    # Public URL of the application (scheme://host[:port]), for the links of the alert notices
    public-url: ${OBSERVE_PUBLIC_URL:}
    viewer:
      title: phylax-api
      # show | hide | auto: logo and name of the viewer bar (hide inside a theme layout)
      brand: auto
    access:
      # Roles of each level of the viewer api, comma separated (any of them is enough, case
      # insensitive). The levels are cumulative: ADMIN includes WRITE and WRITE includes READ.
      # Use specific roles: in a multitenant application the admin of every tenant has ADMIN.
      roles:
        read: ${OBSERVE_ROLES_READ:OBSERVABILITY_READER}
        write: ${OBSERVE_ROLES_WRITE:OBSERVABILITY_ADMIN}
        admin: ${OBSERVE_ROLES_ADMIN:OBSERVABILITY_ADMIN}
      # Optional scope that every level also requires (e.g. platform:global_access to leave out
      # the users of the tenants even with the role)
      # required-scope:
